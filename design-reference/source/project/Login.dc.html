<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Unisphere — Sign in or register</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#F3F5F2}
a{color:#0E6E62;text-decoration:none}a:hover{color:#14201E}
input{box-sizing:border-box}
</style>
</helmet>
<div style="font-family: Manrope, system-ui, sans-serif; color: #141A19; background: #F3F5F2; min-height: 1000px; position: relative; overflow: hidden">

  <!-- page behind -->
  <div aria-hidden="true" style="position: absolute; inset: 0; filter: blur(6px); opacity: 0.7">
    <div style="max-width: 1360px; margin: 0 auto; padding: 120px 104px; box-sizing: border-box; display: flex; gap: 40px; align-items: center">
      <div style="flex: 1; font-size: 86px; line-height: 0.98; font-weight: 800; letter-spacing: -0.045em">Research that<br>unites the world.</div>
      <img src="/_blob/ec719ddc8fd17fe8c4eda079d6040311" alt="" style="width: 620px; max-width: 50%">
    </div>
  </div>
  <div style="position: absolute; inset: 0; background: rgba(20,26,25,0.28)"></div>

  <!-- modal -->
  <div style="position: relative; min-height: 1000px; display: flex; align-items: center; justify-content: center; padding: 32px 16px; box-sizing: border-box">
    <div role="dialog" aria-modal="true" aria-labelledby="dlg-title" style="width: 100%; max-width: 980px; background: #FFFFFF; border-radius: 40px; box-shadow: 0 40px 120px rgba(20,26,25,0.25); display: flex; flex-wrap: wrap; overflow: hidden">

      <div style="flex: 1 1 340px; background: #CDEDE4; padding: 40px; position: relative; overflow: hidden; min-height: 300px; display: flex; flex-direction: column; justify-content: space-between; box-sizing: border-box">
        <img src="/_blob/ec719ddc8fd17fe8c4eda079d6040311" alt="" style="position: absolute; right: -140px; bottom: -160px; width: 520px; opacity: 0.85">
        <div style="position: relative; display: flex; align-items: center; gap: 10px">
          <span style="width: 40px; height: 40px; border-radius: 50%; background: #E9F5B8; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#141A19" stroke-width="1.6" aria-hidden="true"><circle cx="12" cy="12" r="8"/><ellipse cx="12" cy="12" rx="11" ry="4" transform="rotate(-25 12 12)"/></svg></span>
          <span style="font-weight: 800; font-size: 18px">Unisphere</span>
        </div>
        <div style="position: relative; max-width: 300px">
          <div style="font-size: 30px; font-weight: 800; letter-spacing: -0.035em; line-height: 1.08">Join a global community of researchers.</div>
          <div style="margin-top: 18px; display: flex; flex-direction: column; gap: 10px; font-size: 14px; color: #1F3631">
            <span style="display: flex; gap: 10px; align-items: center"><span style="width: 24px; height: 24px; border-radius: 50%; background: #FFFFFF; display: flex; align-items: center; justify-content: center"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#0E6E62" stroke-width="3" aria-hidden="true"><path d="M5 12l5 5 9-10"/></svg></span>Read full papers, figures and video</span>
            <span style="display: flex; gap: 10px; align-items: center"><span style="width: 24px; height: 24px; border-radius: 50%; background: #FFFFFF; display: flex; align-items: center; justify-content: center"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#0E6E62" stroke-width="3" aria-hidden="true"><path d="M5 12l5 5 9-10"/></svg></span>Comment, like and share research</span>
            <span style="display: flex; gap: 10px; align-items: center"><span style="width: 24px; height: 24px; border-radius: 50%; background: #FFFFFF; display: flex; align-items: center; justify-content: center"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#0E6E62" stroke-width="3" aria-hidden="true"><path d="M5 12l5 5 9-10"/></svg></span>Submit and track your own articles</span>
          </div>
        </div>
      </div>

      <div style="flex: 1 1 420px; padding: 40px; box-sizing: border-box; position: relative">
        <a href="Main.dc.html" aria-label="Close" style="position: absolute; right: 24px; top: 24px; width: 44px; height: 44px; border-radius: 50%; background: #F3F5F2; color: #141A19; display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></a>
        <div role="tablist" aria-label="Account" style="display: inline-flex; gap: 4px; background: #F3F5F2; border-radius: 999px; padding: 5px">
          <button type="button" role="tab" aria-selected="{{signInSel}}" onClick="{{toSignIn}}" style="height: 42px; padding: 0 20px; border-radius: 999px; border: 0; background: {{signInBg}}; color: {{signInFg}}; font: inherit; font-size: 14px; font-weight: 700; cursor: pointer">Sign in</button>
          <button type="button" role="tab" aria-selected="{{regSel}}" onClick="{{toRegister}}" style="height: 42px; padding: 0 20px; border-radius: 999px; border: 0; background: {{regBg}}; color: {{regFg}}; font: inherit; font-size: 14px; font-weight: 700; cursor: pointer">Register</button>
        </div>
        <h2 id="dlg-title" style="margin: 26px 0 0; font-size: 30px; font-weight: 800; letter-spacing: -0.03em">{{heading}}</h2>
        <p style="margin: 8px 0 0; font-size: 14px; color: #56605D">{{subheading}}</p>

        <div style="margin-top: 24px; display: flex; flex-direction: column; gap: 14px">
          <sc-if value="{{isRegister}}" hint-placeholder-val="{{ false }}">
            <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px">
              <div><label for="fn" style="font-size: 13px; font-weight: 700">Full name</label><input id="fn" type="text" style="margin-top: 6px; width: 100%; height: 52px; border-radius: 16px; border: 1px solid #DCE1DC; background: #F8FAF8; padding: 0 16px; font: inherit; font-size: 15px"></div>
              <div><label for="inst" style="font-size: 13px; font-weight: 700">Institution</label><input id="inst" type="text" style="margin-top: 6px; width: 100%; height: 52px; border-radius: 16px; border: 1px solid #DCE1DC; background: #F8FAF8; padding: 0 16px; font: inherit; font-size: 15px"></div>
            </div>
          </sc-if>
          <div><label for="em" style="font-size: 13px; font-weight: 700">Email</label><input id="em" type="email" placeholder="you@university.edu" style="margin-top: 6px; width: 100%; height: 52px; border-radius: 16px; border: 1px solid #DCE1DC; background: #F8FAF8; padding: 0 16px; font: inherit; font-size: 15px"></div>
          <div><label for="pw" style="font-size: 13px; font-weight: 700">Password</label><input id="pw" type="password" style="margin-top: 6px; width: 100%; height: 52px; border-radius: 16px; border: 1px solid #DCE1DC; background: #F8FAF8; padding: 0 16px; font: inherit; font-size: 15px"></div>
          <sc-if value="{{isSignIn}}" hint-placeholder-val="{{ true }}">
            <div style="display: flex; justify-content: space-between; align-items: center; font-size: 13px"><label style="display: flex; gap: 8px; align-items: center"><input type="checkbox" style="width: 18px; height: 18px; accent-color: #0E6E62">Keep me signed in</label><a href="#" style="font-weight: 700">Forgot password?</a></div>
          </sc-if>
          <button type="button" style="margin-top: 4px; height: 56px; border-radius: 999px; border: 0; background: #141A19; color: #FFFFFF; font: inherit; font-size: 15px; font-weight: 700; display: flex; align-items: center; justify-content: space-between; padding: 0 7px 0 24px; cursor: pointer">{{cta}}<span style="width: 42px; height: 42px; border-radius: 50%; background: #E9F5B8; color: #141A19; display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></span></button>
          <div style="display: flex; align-items: center; gap: 12px; font-size: 12px; color: #56605D"><span style="flex: 1; height: 1px; background: #E3E7E3"></span>or continue with<span style="flex: 1; height: 1px; background: #E3E7E3"></span></div>
          <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px">
            <button type="button" style="height: 52px; border-radius: 999px; border: 1px solid #DCE1DC; background: #FFFFFF; font: inherit; font-size: 14px; font-weight: 700; color: #141A19; cursor: pointer">ORCID</button>
            <button type="button" style="height: 52px; border-radius: 999px; border: 1px solid #DCE1DC; background: #FFFFFF; font: inherit; font-size: 14px; font-weight: 700; color: #141A19; cursor: pointer">Google</button>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1000}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { mode: 'signin' }; }
  renderVals() {
    const reg = this.state.mode === 'register';
    return {
      isRegister: reg, isSignIn: !reg,
      signInSel: reg ? 'false' : 'true', regSel: reg ? 'true' : 'false',
      signInBg: reg ? 'transparent' : '#141A19', signInFg: reg ? '#141A19' : '#FFFFFF',
      regBg: reg ? '#141A19' : 'transparent', regFg: reg ? '#FFFFFF' : '#141A19',
      heading: reg ? 'Create your free account' : 'Welcome back',
      subheading: reg ? 'Free for readers and authors. Takes under a minute.' : 'Sign in to read full papers and join the discussion.',
      cta: reg ? 'Create account' : 'Sign in',
      toSignIn: () => this.setState({ mode: 'signin' }),
      toRegister: () => this.setState({ mode: 'register' })
    };
  }
}
</script>
</body>
</html>
